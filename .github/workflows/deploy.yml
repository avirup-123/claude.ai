name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (akis-studio)
        run: cd akis-studio && npm install

      - name: Build (akis-studio)
        run: cd akis-studio && npm run build

      - name: Install dependencies (argus)
        run: cd argus && npm install

      - name: Build (argus)
        run: cd argus && npm run build

      - name: Merge build outputs
        run: |
          mkdir -p dist
          cp -r akis-studio/dist/. dist/
          mkdir -p dist/argus
          cp -r argus/dist/. dist/argus/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
